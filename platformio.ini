#
# Marlin Firmware — Sermoon D1
# PlatformIO Configuration File
#
# Target: Creality V4.3.1 (STM32F103RET6, ARM Cortex-M3)
# Build: pio run -e creality
# Upload: pio run -e creality -t upload (J-Link)
#

[platformio]
src_dir      = Marlin
boards_dir   = buildroot/share/PlatformIO/boards
default_envs = creality

[common]
default_build_src_filter = +<src/*> -<src/config> -<src/HAL> +<src/HAL/shared>
extra_scripts = pre:buildroot/share/PlatformIO/scripts/common-cxxflags.py
build_flags = -fmax-errors=5 -g -D__MARLIN_FIRMWARE__ -fmerge-all-constants
# Sermoon D1 needs no external libraries (RTS DWIN uses raw UART,
# TMC2208 is in standalone mode, no MAX31865/Sailfish/L6470).
lib_deps =

[env]
framework   = arduino
build_flags = ${common.build_flags}
lib_deps    = ${common.lib_deps}

#
# Creality V4.3.1 (STM32F103RET6) — Sermoon D1
#
[env:creality]
platform          = ststm32@<6.2.0
board             = genericSTM32F103RE
board_build.core  = maple
build_flags       = !python Marlin/src/HAL/HAL_STM32F1/build_flags.py
  ${common.build_flags} -std=gnu++14 -DSTM32_XL_DENSITY
build_unflags     = -std=gnu++11
build_src_filter  = ${common.default_build_src_filter} +<src/HAL/HAL_STM32F1>
; NOTE: defining extra_scripts in [env:creality] OVERRIDES the key of the
; same name in [common] (nothing here interpolates ${common.extra_scripts}).
; That is why common-cxxflags.py must be listed HERE explicitly — otherwise
; it never runs and the C++ flags (-fno-exceptions/-fno-rtti) are not applied.
lib_ignore        = Adafruit NeoPixel, SPI
; Must MATCH BAUDRATE in Configuration.h (115200).
; The host port (SERIAL_PORT 1) and the DWIN screen port (SERIAL_PORT_2 3)
; share the same BAUDRATE; since the DWIN T5L wants 115200, the host stays
; at 115200 too. To raise it, add a separate BAUDRATE_2 in Configuration.h first.
monitor_speed     = 115200
extra_scripts     = pre:buildroot/share/PlatformIO/scripts/common-cxxflags.py
  pre:buildroot/share/PlatformIO/scripts/version-stamp.py
  buildroot/share/PlatformIO/scripts/creality.py
debug_tool        = jlink
upload_protocol   = serial
upload_port       = COM8
